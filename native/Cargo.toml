[package]
name = "bx-toml-native"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The SDK is not on crates.io. This is a MatchBox develop commit that has the paths, settings, datetime, structs and typed
# error capabilities (ortus-boxlang/matchbox #186 to #193). Keep it in step with MATCHBOX_REV in tests.yml.
matchbox-plugin-sdk = { git = "https://github.com/ortus-boxlang/matchbox", rev = "bfbfdf2a5aeda5b22cf9281a82e0a9c02534175a" }
toml = { version = "0.8", default-features = false, features = ["parse", "preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"

[profile.release]
panic = "unwind"

[dev-dependencies]
serde_json = "1"
